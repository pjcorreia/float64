title: float64
tagline: Double-precision floating home
description: >-
  Plans, research and telemetry for migrating one engineer (and one dog)
  from solid ground to the Tagus.
url: "https://pjcorreia.github.io"
baseurl: "/float64"
timezone: Europe/Lisbon

permalink: /log/:title/

collections:
  boats:
    output: true
    permalink: /boats/:name/
  scenarios:
    output: true
    permalink: /scenarios/:name/

defaults:
  - scope: {path: ""}
    values: {layout: default}
  - scope: {path: "", type: posts}
    values: {layout: post}
  - scope: {path: "", type: boats}
    values: {layout: boat}
  - scope: {path: "", type: scenarios}
    values: {layout: scenario}

# GitHub Pages enables these by default; listed so local `jekyll serve` matches.
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: true

exclude:
  - README.md
