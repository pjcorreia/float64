<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚓</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">float<span>64</span></a>
      <nav>
        <a href="{{ '/log/' | relative_url }}">Log</a>
        <a href="{{ '/boats/' | relative_url }}">Boats</a>
        <a href="{{ '/scenarios/' | relative_url }}">Scenarios</a>
        <a href="{{ '/plans/roadmap/' | relative_url }}">Roadmap</a>
        <a href="{{ '/plans/decisions/' | relative_url }}">Decisions</a>
        <a href="https://github.com/pjcorreia/float64">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
{{ content }}
  </main>
  <footer class="wrap">
    <p><em>Rollback plan: dry land isn't going anywhere.</em></p>
  </footer>
</body>
</html>
